<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="294" viewBox="0 0 1100 294"><rect width="1100" height="294" fill="#f5f7fb"/><g font-family="monospace"><text x="28" y="40" font-size="22" font-weight="bold" fill="#16263d">Missing courtyards: one summary per subcircuit</text><path d="M550 65V269" stroke="#cbd5e1"/><text x="28" y="90" font-size="18" font-weight="bold" fill="#a66a00">Before: 4 warning entries</text><text x="28" y="125" font-size="13" fill="#243247">1. R1 has no courtyard</text><text x="28" y="143" font-size="13" fill="#243247"></text><text x="28" y="161" font-size="13" fill="#243247">2. R2 has no courtyard</text><text x="28" y="179" font-size="13" fill="#243247"></text><text x="28" y="197" font-size="13" fill="#243247">3. C1 has no courtyard</text><text x="28" y="215" font-size="13" fill="#243247"></text><text x="28" y="233" font-size="13" fill="#243247">4. U1 has no courtyard</text><text x="28" y="251" font-size="13" fill="#243247"></text><text x="575" y="90" font-size="18" font-weight="bold" fill="#a66a00">After: 1 warning entry</text><text x="575" y="125" font-size="13" fill="#243247">1. 4 components have no courtyard (R1, R2, C1, +1 more). Add</text><text x="575" y="143" font-size="13" fill="#243247">courtyard geometry to their footprints.</text><text x="575" y="161" font-size="13" fill="#243247"></text></g></svg>