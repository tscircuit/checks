xt-id="pcb_note_text_10" data-pcb-layer="overlay"><tspan x="280.42553191489355">DRC: D1: no capacitor decoupling association; limit 24mm from legacy</tspan><tspan x="280.42553191489355" dy="1em">max_length; origin unavailable; shortest routed copper path</tspan><tspan x="280.42553191489355" dy="1em">including pad traversal and known barrel depth measures 30.00mm,</tspan><tspan x="280.42553191489355" dy="1em">exceeding the configured rule. Layout review required.</tspan></text></svg>