<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="258" viewBox="0 0 1100 258"><rect width="1100" height="258" fill="#f5f7fb"/><g font-family="monospace"><text x="28" y="40" font-size="22" font-weight="bold" fill="#16263d">U1: incomplete pin metadata</text><path d="M550 65V233" stroke="#cbd5e1"/><text x="28" y="90" font-size="18" font-weight="bold" fill="#a66a00">Before: 3 warning entries</text><text x="28" y="125" font-size="13" fill="#243247">1. All pins on U1 are underspecified (no pinAttributes set)</text><text x="28" y="143" font-size="13" fill="#243247"></text><text x="28" y="161" font-size="13" fill="#243247">2. U1 has no pin with requires_power=true</text><text x="28" y="179" font-size="13" fill="#243247"></text><text x="28" y="197" font-size="13" fill="#243247">3. U1 has no pin with requires_ground=true</text><text x="28" y="215" font-size="13" fill="#243247"></text><text x="575" y="90" font-size="18" font-weight="bold" fill="#a66a00">After: 1 warning entry</text><text x="575" y="125" font-size="13" fill="#243247">1. U1 has incomplete pin metadata: no pinAttributes set; no</text><text x="575" y="143" font-size="13" fill="#243247">requires_power pin; no requires_ground pin. Define the</text><text x="575" y="161" font-size="13" fill="#243247">applicable pinAttributes.</text><text x="575" y="179" font-size="13" fill="#243247"></text></g></svg>