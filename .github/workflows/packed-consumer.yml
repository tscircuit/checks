name: Packed Consumer

on:
  pull_request:
    branches: [main]

jobs:
  packed-consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun-version: ["1.3.12", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun install
      - run: bun run build
      - run: bun scripts/test-packed-consumer.ts
